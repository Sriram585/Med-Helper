<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediMind | Professional Health Analysis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <nav class="sidebar">
        <div class="brand">
          <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
          <span>MediMind</span>
        </div>

        <div class="nav-links">
          <a href="#" class="active"
            ><i class="fas fa-stethoscope"></i> Diagnosis</a
          >
          <a href="#"><i class="fas fa-history"></i> History</a>
          <a href="#"><i class="fas fa-cog"></i> Settings</a>
        </div>

        <div class="user-profile">
          <div class="avatar"><i class="fas fa-user"></i></div>
          <div class="user-info">
            <span class="name">Guest User</span>
            <span class="status">Basic Plan</span>
          </div>
        </div>
      </nav>

      <main class="main-content">
        <header class="top-header">
          <div>
            <h1>Health Analysis</h1>
            <p class="subtitle">
              AI-Powered Symptom Checker & Treatment Planner
            </p>
          </div>
          <button class="btn-secondary"><i class="fas fa-bell"></i></button>
        </header>

        <section class="search-section">
          <div class="search-card">
            <div class="input-group">
              <i class="fas fa-comment-medical search-icon"></i>
              <textarea
                id="symptoms"
                placeholder="Describe your symptoms in detail (e.g., 'Persistent cough, mild fever, and fatigue for 3 days')..."
              ></textarea>
            </div>
            <div class="action-area">
              <span class="hint-text"
                ><i class="fas fa-info-circle"></i> Private & Secure
                Analysis</span
              >
              <button class="btn-primary" onclick="analyzeSymptoms()">
                Run Analysis <i class="fas fa-arrow-right"></i>
              </button>
            </div>
          </div>
        </section>

        <div id="loader" class="loader-wrapper">
          <div class="pulse-ring"></div>
          <i class="fas fa-heartbeat heart-icon"></i>
          <p>Analyzing Clinical Patterns...</p>
        </div>

        <div id="results-area" class="results-feed"></div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
